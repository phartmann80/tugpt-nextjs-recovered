# docker-compose.yml
#
# Production runtime for TuGPT.ai on its dedicated VPS (212.227.44.13 —
# see docs/production_environment.md, section 5, for the full deployment
# runbook, including the cutover plan from the existing systemd-native
# workers to this stack). Run from /opt/tugpt. Today that means the web
# service only — read the warning below before running it unfiltered:
#
#   docker compose -p tugpt up -d --build web
#
# The explicit `-p tugpt` project name namespaces containers/networks
# under a stable, predictable prefix regardless of what else runs on the
# host.
#
# Secrets and per-environment config are NOT stored in this repo and are
# NOT baked into images. Every service loads its environment at container
# start via `env_file`, from a file that lives only on the host, under
# /etc/tugpt/ (root-owned, 0600) — never committed to git. This matches
# the existing systemd-native workers' env layout
# (/etc/tugpt/web.env, /etc/tugpt/worker.env) so the cutover doesn't
# require re-provisioning secrets.
#
# ---------------------------------------------------------------------
# WARNING — bringing this whole file up starts worker containers.
#
# `whatsapp-worker` and `draft-worker` below are the SAME jobs that
# tugpt-whatsapp-worker.service and tugpt-draft-worker.service run
# natively on the host today. Starting the full stack while those
# systemd units are active puts two consumers on each PGMQ queue
# (whatsapp_inbound, draft_generation) and double-processes every
# message.
#
# As of 2026-08-20 only the web app is being containerized; the workers
# stay on systemd. Deploy web ALONE:
#
#   docker compose -p tugpt up -d --build web
#
# or via deploy/systemd/tugpt-web.service, which does exactly that and
# nothing else. deploy/systemd/tugpt.service brings up the whole stack
# and must not be enabled until the worker cutover in section 5.4 of
# docs/production_environment.md is executed deliberately.
# ---------------------------------------------------------------------

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Next.js inlines NEXT_PUBLIC_* at BUILD time, into the server bundle as
      # well as the client one. Without this args block Compose forwards
      # nothing — shell variables on the `docker compose build` command line are
      # used for interpolation, not passed to the builder — so the Dockerfile's
      # ARGs default to empty and the image is built with blank values.
      #
      # That failure is silent and total. proxy.ts reads
      # NEXT_PUBLIC_SUPABASE_URL and redirects to /auth/login when it is empty,
      # so every /dashboard route bounces to the login page forever; server.ts
      # throws "Supabase URL is missing"; every /api/v1 route builds a client
      # against ''. The app looks deployed and is entirely dead, and it reads
      # like an authentication bug rather than a build one.
      #
      # `:?` makes Compose refuse to run rather than bake empties. Supply them
      # by sourcing the env file first — see docs/production_environment.md
      # section 5.4a:
      #   set -a; . /etc/tugpt/web.env; set +a
      # Neither value is a secret (the anon key is public by design); they are
      # kept in web.env so there is one place to change them.
      args:
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:?missing - run 'set -a; . /etc/tugpt/web.env; set +a' before building}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?missing - run 'set -a; . /etc/tugpt/web.env; set +a' before building}"
    image: tugpt-web:latest
    restart: unless-stopped
    env_file:
      - /etc/tugpt/web.env
    # Bind to loopback only. Nothing reaches this from outside the host
    # unless the `caddy` service below is enabled, and even then Caddy
    # talks to it over the compose network (web:3000), not this port —
    # 3001 stays a local debugging convenience.
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - tugpt
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # TLS termination and public routing. OFF by default: the `proxy` profile
  # means `docker compose up -d web` neither starts it nor can start it by
  # accident. Enable deliberately with
  #   docker compose -p tugpt --profile proxy up -d caddy
  # once TUGPT_DOMAIN is set in /etc/tugpt/web.env and its DNS A/AAAA record
  # points at this host. See docs/production_environment.md section 5.4b.
  #
  # Without this, the dashboard is reachable on the server (127.0.0.1:3001) and
  # nowhere else, which is the state section 5.4a leaves behind.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    # TUGPT_DOMAIN is read from here by the Caddyfile. Using env_file rather
    # than Compose interpolation on purpose: an interpolated ${VAR} is resolved
    # when the file is parsed, so it would be required by every compose command
    # even with the profile off.
    env_file:
      - /etc/tugpt/web.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the issued certificates and the ACME account key.
      # Losing it means re-issuing on every restart, which will hit Let's
      # Encrypt rate limits. It must stay a named volume.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tugpt
    depends_on:
      - web

  whatsapp-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: tugpt-worker:latest
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file:
      - /etc/tugpt/worker.env
    networks:
      - tugpt
    # Give in-flight work time to finish on SIGTERM before Docker sends
    # SIGKILL (default grace period is only 10s). This worker's unit of
    # work is one process_inbound_message RPC call — bounded by DB
    # latency, but 30s (matching WORKER_VISIBILITY_TIMEOUT_SECONDS) is a
    # safe margin above the default.
    stop_grace_period: 30s

  draft-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: tugpt-worker:latest
    restart: unless-stopped
    command: ["node", "dist/draft-index.js"]
    env_file:
      - /etc/tugpt/worker.env
    networks:
      - tugpt
    # SIGTERM only aborts the poll loop between jobs (see
    # apps/worker/src/draft-worker.ts) — it does NOT cancel an in-flight
    # processJob() call. As of the 2026-08-18 single-provider decision
    # (see ADR-006), TuGPT calls only Langdock per attempt (~25s worst
    # case, down from ~75s under the old three-provider chain), plus
    # surrounding DB RPC calls (quota reservation, draft storage). 90s
    # stays as a conservative margin above that before Docker's default
    # 10s grace period would otherwise SIGKILL the worker mid-job; revisit
    # downward only as a deliberate, separate change if ever needed.
    stop_grace_period: 90s

networks:
  tugpt:
    driver: bridge

volumes:
  # Issued certificates and the ACME account key. Only used by the `proxy`
  # profile; declaring them here is inert otherwise.
  caddy_data:
  caddy_config:
